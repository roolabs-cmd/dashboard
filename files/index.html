<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1613;--card:#26201b;--text:#f1e9df;--muted:#a09386;--accent:#f0a24b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Outfit","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(94vw,560px);background:var(--card);border-radius:34px;padding:clamp(18px,4vw,30px)}
.status{color:var(--muted);text-align:center;font-size:18px;padding:30px 0}
.place{color:var(--muted);font-size:clamp(14px,2.4vw,17px);margin-bottom:6px}
.main{display:flex;align-items:center;gap:clamp(10px,3vw,20px)}
.icon{width:clamp(76px,18vw,110px);flex:none}
.now{flex:1}
.cond{color:var(--muted);font-size:clamp(16px,3vw,21px)}
.temp{font-size:clamp(52px,12vw,84px);font-weight:300;letter-spacing:-.03em;line-height:1.05}
.hl{text-align:right;color:var(--muted);font-size:clamp(15px,2.8vw,20px);line-height:1.6}
.hl b{color:var(--text);font-weight:500}
.cap{color:var(--muted);font-size:13px;margin-top:18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:8px}
.bars i{flex:1;background:var(--accent);border-radius:99px;min-height:4px}
.hours{display:flex;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.hours span{flex:1;text-align:center}
.foot{color:var(--muted);font-size:12px;margin-top:16px;text-align:right}
/* icons */
.ico{width:100%;height:auto;overflow:visible}
.line{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.accent{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cloud{animation:drift 7s ease-in-out infinite alternate}
.sun{transform-origin:center;transform-box:fill-box;animation:spin 40s linear infinite}
.drop{animation:fall 1.8s linear infinite;opacity:0}
.drop:nth-of-type(2){animation-delay:.6s}.drop:nth-of-type(3){animation-delay:1.2s}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.sun,.drop{animation:none}.drop{opacity:1}}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <p class="status" id="status">Loading weather…</p>
  <div id="content" hidden>
    <div class="place" id="place"></div>
    <div class="main">
      <div class="icon" id="icon"></div>
      <div class="now"><div class="cond" id="cond"></div><div class="temp" id="temp"></div></div>
      <div class="hl">High <b id="hi"></b><br>Low <b id="lo"></b></div>
    </div>
    <div class="cap">Chance of rain, next 12 hours</div>
    <div class="bars" id="bars"></div>
    <div class="hours" id="hours"></div>
    <div class="foot" id="foot"></div>
  </div>
</main>
<script src="weather.js"></script>
</body>
</html>
